plugins { id 'fabric-loom' version '1.6.12' }
base { archivesName = 'together-companion-fabric-1.21.1' }
loom { mixin { useLegacyMixinAp = false } }
dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.1+1.21.1'
}
// Version-specific sources override the shared implementation, never the 1.20.1 build.
def overlay = tasks.register('prepareVersionSources', Sync) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from 'src/main/java'
    from '../common1211/src/main/java'
    from '../fabric/src/main/java'
    from '../common/src/main/java'
    into layout.buildDirectory.dir('generated/version-sources')
}
sourceSets.main.java.setSrcDirs([overlay])

sourceSets {
    liveTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
def liveJar=tasks.register('liveProbeJar',Jar) {
    archiveClassifier='live-test-dev'
    from sourceSets.liveTest.output
}
tasks.register('remapLiveProbe',net.fabricmc.loom.task.RemapJarTask) {
    dependsOn liveJar
    inputFile=liveJar.flatMap { it.archiveFile }
    archiveClassifier='live-test'
    addNestedDependencies=false
}
