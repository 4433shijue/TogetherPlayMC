pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        gradlePluginPortal()
        mavenCentral()
    }
}
rootProject.name = 'together-companion'
def selectedLoader = providers.gradleProperty('companionLoader').orNull
if (selectedLoader != null) {
    if (!(selectedLoader in ['fabric', 'forge', 'fabric1211', 'neoforge1211'])) throw new GradleException('Unknown companion loader')
    include selectedLoader
} else {
    include 'fabric', 'forge'
}
