name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
  neoforge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - run: gradle -p companion-mod -PcompanionLoader=neoforge1211 :neoforge1211:build
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge-1.21.1-preview
          path: companion-mod/neoforge1211/build/libs/together-companion-neoforge-1.21.1-0.6.0.jar
          if-no-files-found: error
